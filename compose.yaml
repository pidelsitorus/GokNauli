services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goknauli-app
    working_dir: /var/www/html
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: goknauli-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gok_nauli
      MYSQL_USER: goknauli
      MYSQL_PASSWORD: goknauli123
    ports:
      - "3306:3306"
    volumes:
      - goknauli_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  goknauli_mysql_data: